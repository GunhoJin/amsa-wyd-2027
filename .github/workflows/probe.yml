name: probe-rosary
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -A "Mozilla/5.0" https://wyd.catholic.or.kr/status.asp -o s.html
          wc -c s.html
          python3 - <<'PY'
          import re
          h=open('s.html',encoding='utf-8',errors='replace').read()
          t=re.sub(r'<script[\s\S]*?</script>',' ',h,flags=re.I)
          t=re.sub(r'<[^>]+>',' ',t); t=re.sub(r'\s+',' ',t)
          for m in list(re.finditer(r'([0-9][0-9,]{3,})\s*(단|곳|개|%)',t))[:40]:
              print('C|',t[max(0,m.start()-50):m.end()+10])
          for u in re.findall(r'["\'`]([^"\'`\s]*?\.(?:asp|aspx|json|php)[^"\'`\s]*)["\'`]',h)[:40]: print('U|',u)
          for m in re.finditer(r'(ajax|fetch|\$\.(get|post)|XMLHttpRequest)[\s\S]{0,200}',h): print('J|',m.group(0)[:200].replace('\n',' '))
          PY
